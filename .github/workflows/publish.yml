name: Publish

# Publishing happens on a release, not on every push, so a tag that is
# published by accident cannot put a broken version on Packagist.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, e.g. v1.0.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The version on Packagist comes from the tag, so the tag has to be
          # fetched and not just the default branch.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The SDK verifies Ed25519 certificates, so sodium is not optional.
          extensions: sodium, json, openssl
          coverage: none

      - name: Install Composer
        uses: ramsey/composer-install@v3

      - name: Check the token is there
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_API_TOKEN" ]; then
              echo "::error::No Packagist API token. Add PACKAGIST_API_TOKEN to the"
              echo "::error::repository secrets — it needs the 'publish' scope and nothing else."
              exit 1
          fi

      - name: Derive the version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

          # Packagist and the tag have to agree. A mismatch means the release
          # is tagged differently from the package, and publishing it would
          # put a version on Packagist that no tag points at.
          composer config version "$VERSION"
          composer validate --no-check-publish --no-interaction

      - name: Publish to Packagist
        run: |
          composer config --no-plugins allow-plugins.composer/packagist-publisher true
          composer require --dev --no-interaction composer/packagist-publisher
          composer publish --no-interaction --no-progress --no-scripts
        env:
          # A Packagist API token, stored as a repository secret.
          COMPOSER_AUTH: '{"github.com":{"oauth2":"${{ secrets.PACKAGIST_API_TOKEN }}"}}'
